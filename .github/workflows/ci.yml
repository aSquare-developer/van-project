name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: van_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptesting" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: van_test
      DB_USERNAME: root
      DB_PASSWORD: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare test environment
        run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit --locked
      - name: Check tracked files
        run: python3 .github/scripts/check-tracked-files.py
      - name: Validate deployment scripts
        run: |
          bash -n .github/scripts/deploy-zone.sh
          shellcheck .github/scripts/deploy-zone.sh
          python3 .github/scripts/test_deploy_zone.py
      - name: PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l
      - run: vendor/bin/pint --test
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run build
      - run: php artisan migrate --force
      - run: php artisan test --display-warnings --fail-on-warning
      - run: php artisan config:cache
      - run: php artisan route:cache
      - run: php artisan view:cache
      - run: php artisan optimize:clear
